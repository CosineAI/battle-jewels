<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Puzzle League Clone</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main>
    <div class="game-container">
      <div class="controls">
        <label for="speed">Speed:</label>
        <select id="speed">
          <option value="slow">Slow</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>
        <label for="theme">Theme:</label>
        <select id="theme">
          <option value="default" selected>Default</option>
          <option value="pastel">Pastel</option>
          <option value="neon">Neon</option>
          <option value="synthwave">Synthwave</option>
          <option value="retro">Retro</option>
          <option value="shooter">Modern Shooter</option>
        </select>
        <button id="startBtn">New Game</button>
        <div class="score">Score: <span id="scoreValue">0</span></div>
        <div class="stats">PU: <span id="statsValue">O:0 R:0 C:0</span></div>
      </div>
      <canvas id="game"></canvas>
      <p class="instructions">
        Swap adjacent tiles to make 3+ in a row or column. Mouse drag or arrows + space/enter.
        Blocks rise from the bottom. Game over when they reach the top.
        Choose a speed and theme above and click New Game, or press R to restart with the selected settings.
      </p>
    </div>
  </main>
  <script src="assets/script.js"></script>
</body>
</html>
